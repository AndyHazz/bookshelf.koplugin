name: Feature idea
description: Something new you'd like Bookshelf to do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Bookshelf?
      options:
        - Shelf views (covers, spines, list, folders, series)
        - Shelf bar (chips, sources, grouping, sort, filters)
        - Top panel
        - Modules (in the top panel, start menu or on a shelf)
        - Start menu
        - Book menu (long-press on a book)
        - Themes, wallpapers, planks or ornaments
        - OPDS, stores, Hardcover, updates or other services
        - Book info (metadata, covers, page counts, calibre)
        - Deleting, moving or renaming books and folders
        - Settings or gestures
        - Speed, memory, battery or storage
        - Not sure
